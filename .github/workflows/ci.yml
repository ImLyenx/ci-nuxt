name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  ci:
    needs: [lint, format, typecheck]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      actions: read
    steps:
      - name: 'notify vercel'
        uses: 'vercel/repository-dispatch/actions/status@v1'
        with:
          name: 'Vercel - ci-nuxt: lint'

      - name: All checks passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - run: pnpm --filter infra exec cdk deploy CiNuxtApi CiNuxtWeb --require-approval never
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}

  # static frontend: nuxt generate -> S3 -> CloudFront
  deploy-web:
    needs: deploy
    runs-on: ubuntu-latest
    concurrency: deploy-web
    env:
      BUCKET: ${{ vars.WEB_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.WEB_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - run: pnpm --filter web generate
        env:
          NUXT_PUBLIC_API_BASE: ${{ vars.API_BASE_URL }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      # hashed assets never change: cache forever. everything else (html,
      # payloads) is revalidated on each request
      - name: Upload to S3
        working-directory: web/.output/public
        run: |
          aws s3 sync _nuxt "s3://$BUCKET/_nuxt" --delete \
            --cache-control 'public,max-age=31536000,immutable'
          aws s3 sync . "s3://$BUCKET" --delete --exclude '_nuxt/*' \
            --cache-control 'public,max-age=0,must-revalidate'

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*'
