name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # postinstall runs `nuxt prepare`, which generates .nuxt/eslint.config.mjs
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check
