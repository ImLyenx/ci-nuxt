name: Deploy

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to deploy (an older one rolls back)
        required: true
        default: master

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: deploy-api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      # before deploying, so new code never runs against an old schema
      # (psql is preinstalled on GitHub's ubuntu runners)
      - run: ./db/migrate.sh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - run: pnpm --filter infra exec cdk deploy CiNuxtApi CiNuxtWeb --require-approval never
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}

  # static frontend: nuxt generate -> S3 -> CloudFront
  web:
    needs: api
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: deploy-web
    env:
      BUCKET: ${{ vars.WEB_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.WEB_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup

      - run: pnpm --filter web generate
        env:
          NUXT_PUBLIC_API_BASE: ${{ vars.API_BASE_URL }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      # hashed assets never change: cache forever. everything else (html,
      # payloads) is revalidated on each request
      - name: Upload to S3
        working-directory: web/.output/public
        run: |
          aws s3 sync _nuxt "s3://$BUCKET/_nuxt" --delete \
            --cache-control 'public,max-age=31536000,immutable'
          aws s3 sync . "s3://$BUCKET" --delete --exclude '_nuxt/*' \
            --cache-control 'public,max-age=0,must-revalidate'

      - name: Invalidate CloudFront
        run: |
          id="$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths '/*' --query Invalidation.Id --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$id"

  smoke:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/smoke.sh
        env:
          API_URL: ${{ vars.API_BASE_URL }}
          SSG_URL: ${{ vars.WEB_URL }}
